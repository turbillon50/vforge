# vf-vivo — un host por slot. Cada slot es un servidor de desarrollo vivo.
# sslip.io resuelve vivoN.178.105.135.26.sslip.io → 178.105.135.26 sin tocar DNS,
# así que el certificado sale con HTTP-01 sin depender de name.com.
#
# nginx sólo termina TLS y pasa todo a la pasarela (127.0.0.1:9311), que es quien
# valida el token, elige el dev server y apaga lo ocioso.

map $http_upgrade $vivo_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name vivo1.178.105.135.26.sslip.io vivo2.178.105.135.26.sslip.io vivo3.178.105.135.26.sslip.io;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  server_name vivo1.178.105.135.26.sslip.io;
  ssl_certificate /etc/letsencrypt/live/vivo1.178.105.135.26.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vivo1.178.105.135.26.sslip.io/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  set $vivo_slot vivo1;
  include /etc/nginx/snippets/vivo-proxy.conf;
}

server {
  listen 443 ssl;
  server_name vivo2.178.105.135.26.sslip.io;
  ssl_certificate /etc/letsencrypt/live/vivo2.178.105.135.26.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vivo2.178.105.135.26.sslip.io/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  set $vivo_slot vivo2;
  include /etc/nginx/snippets/vivo-proxy.conf;
}

server {
  listen 443 ssl;
  server_name vivo3.178.105.135.26.sslip.io;
  ssl_certificate /etc/letsencrypt/live/vivo3.178.105.135.26.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vivo3.178.105.135.26.sslip.io/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  set $vivo_slot vivo3;
  include /etc/nginx/snippets/vivo-proxy.conf;
}
