# Cuerpo común de los tres slots. Va a /etc/nginx/snippets/vivo-proxy.conf.

location / {
  proxy_pass http://127.0.0.1:9311;
  proxy_http_version 1.1;

  # Recarga en caliente de Next: sin el upgrade no hay "se ve solo".
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $vivo_connection_upgrade;

  proxy_set_header Host $host;
  proxy_set_header X-Vivo-Slot $vivo_slot;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # El Estudio de VForge tiene que poder meter esto en un iframe.
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Content-Security-Policy;
  add_header Content-Security-Policy "frame-ancestors https://vforge.site https://*.vforge.site https://*.vercel.app http://localhost:3000" always;

  # Nunca en buscadores: esto es la fábrica de Luis, no un sitio público.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
