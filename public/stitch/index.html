<!DOCTYPE html>
<html lang="es" class="dark"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>VForge · Galería Stitch</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>body{font-family:Geist,system-ui,sans-serif;background:#0a0a0f}.frame{transform:scale(.5);transform-origin:top left;width:200%;height:200%;border:0;pointer-events:none}</style>
</head>
<body class="min-h-screen text-white">
<div class="mx-auto max-w-6xl px-6 py-12">
  <p class="font-mono text-[11px] uppercase tracking-[0.22em]" style="color:rgba(255,255,255,.46)">Diseño generado con Google Stitch · sistema VForge</p>
  <h1 class="mt-3 text-4xl font-semibold tracking-tight">Galería de pantallas</h1>
  <p class="mt-2 text-sm" style="color:rgba(255,255,255,.6)">Estilo unificado: obsidiana, glass, Geist, morado solo en botones. Haz clic para ver cada pantalla a tamaño real.</p>
  <div id="grid" class="mt-10 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
</div>
<script>
const screens=[
 ["inicio","Inicio"],["conexiones","Conexiones"],["estudio","Estudio"],
 ["mis-apps","Mis apps"],["cobros","Cobros"],["perfil","Perfil"],["landing","Landing"]];
const grid=document.getElementById("grid");
screens.forEach(([slug,label])=>{
 const card=document.createElement("a");
 card.href=slug+".html"; card.target="_blank";
 card.className="group block overflow-hidden rounded-2xl transition";
 card.style.cssText="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)";
 card.innerHTML=`<div style="height:200px;overflow:hidden;position:relative;background:#0a0a0f">
   <iframe src="${slug}.html" class="frame" loading="lazy" onerror="this.parentNode.innerHTML='<div style=\\'display:flex;height:100%;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:13px\\'>Generando…</div>'"></iframe>
   </div>
   <div style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
   <span style="font-weight:600">${label}</span>
   <span style="font-size:12px;color:#a78bfa">Abrir →</span></div>`;
 grid.appendChild(card);
});
</script>
</body></html>
